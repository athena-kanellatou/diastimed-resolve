name: Verify RESOLVE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify planner and execution rules
        run: npm test
      - name: Reproduce engineering benchmark
        run: npm run benchmark
      - name: Verify benchmark against saved results
        run: node scripts/verify-benchmark.mjs
      - name: Reproduce saved policy sensitivity
        run: npm run sensitivity:check
      - name: Restore verified judging presentation assets
        run: node scripts/restore-judging-assets.mjs
      - name: Prepare redistributable source
        run: python3 scripts/package-source.py
      - name: Type-check and build
        run: npm run build
      - name: Install test Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflow, real task, offline reload and project path
        run: |
          mkdir -p artifacts
          npm exec vite preview -- --host 127.0.0.1 --port 4173 > artifacts/preview.log 2>&1 &
          preview_pid=$!
          project_preview_pid=''
          trap 'kill "$preview_pid" ${project_preview_pid:+"$project_preview_pid"}' EXIT
          node scripts/wait-preview.mjs
          RESOLVE_URL=http://127.0.0.1:4173/ node scripts/browser-verification.mjs
          npm run build -- --base=/diastimed-resolve/
          npm exec vite preview -- --host 127.0.0.1 --port 4174 --base=/diastimed-resolve/ > artifacts/project-preview.log 2>&1 &
          project_preview_pid=$!
          RESOLVE_URL=http://127.0.0.1:4174/diastimed-resolve/ node scripts/wait-preview.mjs
          RESOLVE_URL=http://127.0.0.1:4174/diastimed-resolve/ RESOLVE_BROWSER_QUICK=1 RESOLVE_BROWSER_OUTPUT=artifacts/browser-project-path node scripts/browser-verification.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: resolve-build-and-evidence
          path: |
            dist/
            artifacts/
            public/benchmark.json
            public/sensitivity/
            docs/SENSITIVITY.md
            public/DiastiMed_RESOLVE_source.zip
            docs/EVALUATION.md
          if-no-files-found: error
          retention-days: 30
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build for the public project address
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run build -- --base=/diastimed-resolve/
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified application
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
