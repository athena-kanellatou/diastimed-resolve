name: Verify RESOLVE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify planner and execution rules
        run: npm test
      - name: Reproduce engineering benchmark
        run: npm run benchmark
      - name: Verify benchmark against saved results
        run: node scripts/verify-benchmark.mjs
      - name: Prepare redistributable source
        run: python3 scripts/package-source.py
      - name: Type-check and build
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resolve-build-and-evidence
          path: |
            dist/
            public/benchmark.json
            public/DiastiMed_RESOLVE_source.zip
            docs/EVALUATION.md
          if-no-files-found: error
          retention-days: 30
